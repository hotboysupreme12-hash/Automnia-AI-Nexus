        <circle cx="32" cy="36" r="12" fill="#a884ff"/>
        <text x="58" y="42" fill="#dce6f7" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="850">Browser</text>
      </g>
      <g transform="translate(322 120)">
        <rect width="126" height="72" rx="20" fill="#ffffff" opacity="0.055"/>
        <circle cx="32" cy="36" r="12" fill="#ff7adf"/>
        <text x="58" y="42" fill="#dce6f7" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="850">SMS</text>
      </g>
      <g transform="translate(468 120)">

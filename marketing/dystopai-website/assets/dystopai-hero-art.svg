<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">DystopAI command center hero art</title>
  <desc id="desc">A futuristic product interface showing agent cards, a mission timeline, plugin tiles, and a runtime monitor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09101f"/>
      <stop offset="0.48" stop-color="#0b1223"/>
      <stop offset="1" stop-color="#03050b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17223a" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#07101f" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#77e7ff"/>
      <stop offset="0.55" stop-color="#a884ff"/>
      <stop offset="1" stop-color="#ff7adf"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6df6bd"/>
      <stop offset="1" stop-color="#77e7ff"/>
    </linearGradient>
    <radialGradient id="halo" cx="48%" cy="34%" r="58%">
      <stop offset="0" stop-color="#77e7ff" stop-opacity="0.26"/>
      <stop offset="0.46" stop-color="#a884ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff7adf" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="40" stdDeviation="45" flood-color="#000000" flood-opacity="0.48"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1600" height="1120" rx="72" fill="url(#bg)"/>
  <rect width="1600" height="1120" rx="72" fill="url(#grid)"/>
  <circle cx="780" cy="360" r="520" fill="url(#halo)"/>
  <circle cx="178" cy="152" r="112" fill="#77e7ff" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1392" cy="890" r="164" fill="#ff7adf" opacity="0.12" filter="url(#glow)"/>

  <g opacity="0.88">
    <path d="M278 764C470 612 604 732 764 552C924 372 1068 428 1328 274" fill="none" stroke="#77e7ff" stroke-opacity="0.22" stroke-width="4"/>

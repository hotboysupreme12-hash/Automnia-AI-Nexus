name: Public Release Candidate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: public-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    name: Unsigned Windows installer and lifecycle evidence
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      AUTOMNIA_RELEASE_REQUIRE_SIGNING: '0'
      AUTOMNIA_UPDATE_REQUIRE_SIGNING: '1'
      AUTOMNIA_UPDATE_CHANNEL: stable-x64
    steps:
      - name: Check out release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Require update-channel signing secret
        shell: pwsh
        env:
          UPDATE_KEY: ${{ secrets.AUTOMNIA_UPDATE_SIGNING_PRIVATE_KEY_PEM }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_KEY)) { throw 'Missing required release secret: AUTOMNIA_UPDATE_SIGNING_PRIVATE_KEY_PEM' }

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare vendored OpenClaw dependencies
        run: npm run prepare:openclaw-vendor

      - name: Prepare runtime bundles for readiness checks
        run: npm run prepare:runtime-bundles

      - name: Embed update verification configuration
        env:
          AUTOMNIA_UPDATE_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.AUTOMNIA_UPDATE_SIGNING_PRIVATE_KEY_PEM }}
          AUTOMNIA_UPDATE_SIGNING_KEY_ID: ${{ vars.AUTOMNIA_UPDATE_SIGNING_KEY_ID }}
          AUTOMNIA_UPDATE_BASE_URL: ${{ vars.AUTOMNIA_UPDATE_BASE_URL }}-x64
          AUTOMNIA_UPDATE_CHANNEL: stable-x64
        run: npm run release:update-build-config

      - name: Verify release candidate source
        run: npm run verify:release-candidate

      - name: Build unsigned NSIS installer
        env:
          AUTOMNIA_SKIP_PLATFORM_SIGNING: '1'
          AUTOMNIA_UPDATE_REQUIRE_EMBEDDED_CONFIG: '1'
        run: npm run dist:win

      - name: Launch packaged OpenClaw Gateway and verify the pinned runtime
        env:
          AUTOMNIA_PACKAGED_WINDOWS_ROOT: release/win-installer/win-unpacked
        run: npm run smoke:packaged-openclaw-gateway

      - name: Generate signed update manifest
        env:
          AUTOMNIA_UPDATE_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.AUTOMNIA_UPDATE_SIGNING_PRIVATE_KEY_PEM }}
          AUTOMNIA_UPDATE_SIGNING_KEY_ID: ${{ vars.AUTOMNIA_UPDATE_SIGNING_KEY_ID }}
          AUTOMNIA_UPDATE_CHANNEL: stable-x64
        run: npm run release:update-manifest

      - name: Verify update manifest
        run: npm run release:update-verify

      - name: Download the currently published installer for a real upgrade check
        shell: pwsh
        run: |
          $previousInstaller = Join-Path $env:RUNNER_TEMP 'automnia-previous-setup.exe'
          $previousUrl = 'https://storage.googleapis.com/automnia-public-downloads-98780848640/releases/current/Automnia-Setup-x64.exe'
          curl.exe --fail --location --retry 3 --output $previousInstaller $previousUrl
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $previousInstaller -PathType Leaf)) { throw 'Could not download the currently published Windows installer for the upgrade test.' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "AUTOMNIA_PREVIOUS_WINDOWS_INSTALLER_PATH=$previousInstaller"

      - name: Run install, upgrade, rollback, and uninstall lifecycle
        env:
          AUTOMNIA_PLATFORM_SIGNING_REQUIRED: '0'
          AUTOMNIA_WINDOWS_INSTALLER_TIMEOUT_SECONDS: '900'
          AUTOMNIA_WINDOWS_UPGRADE_TIMEOUT_SECONDS: '1800'
        run: npm run release:lifecycle:windows

      - name: Upload Windows lifecycle diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: automnia-windows-lifecycle-${{ github.run_id }}
          path: release/evidence/lifecycle/
          if-no-files-found: ignore
          retention-days: 14

      - name: Generate release SBOM and checksums
        run: npm run release:evidence

      - name: Sign checksum manifest when configured
        if: ${{ vars.AUTOMNIA_RELEASE_SIGNING_ENABLED == 'true' }}
        env:
          AUTOMNIA_RELEASE_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.AUTOMNIA_RELEASE_SIGNING_PRIVATE_KEY_PEM }}
          AUTOMNIA_RELEASE_SIGNING_KEY_ID: ${{ vars.AUTOMNIA_RELEASE_SIGNING_KEY_ID }}
        run: npm run release:sign

      - name: Validate unsigned public release chain
        run: npm run release:validate

      - name: Upload unsigned Windows release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: automnia-windows-public-release
          path: |
            release/win-installer/**
            release/updates/**
            release/evidence/**
          if-no-files-found: error
          retention-days: 90

  macos:
    name: Unsigned macOS DMG and ZIP
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - name: Check out release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare vendored OpenClaw dependencies
        run: npm run prepare:openclaw-vendor

      - name: Prepare runtime bundles for readiness checks
        run: npm run prepare:runtime-bundles

      - name: Embed update verification configuration
        env:
          AUTOMNIA_UPDATE_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.AUTOMNIA_UPDATE_SIGNING_PRIVATE_KEY_PEM }}
          AUTOMNIA_UPDATE_SIGNING_KEY_ID: ${{ vars.AUTOMNIA_UPDATE_SIGNING_KEY_ID }}
          AUTOMNIA_UPDATE_BASE_URL: ${{ vars.AUTOMNIA_UPDATE_BASE_URL }}-x64
          AUTOMNIA_UPDATE_CHANNEL: stable-x64
        run: npm run release:update-build-config

      - name: Verify release candidate source
        run: npm run verify:release-candidate

      - name: Build unsigned Intel Mac DMG and ZIP
        shell: bash
        env:
          AUTOMNIA_SKIP_PLATFORM_SIGNING: '1'
          AUTOMNIA_UPDATE_REQUIRE_EMBEDDED_CONFIG: '1'
          AUTOMNIA_TARGET_ARCH: x64
        run: bash scripts/build-macos-release.sh x64

      - name: Validate unsigned macOS package outputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find release -type f \( -name '*.dmg' -o -name '*.zip' \) -print -quit)"
          test -n "$(find release -type f -name '*-x64.dmg' -print -quit)"
          test -z "$(find release -type f -iname '*-arm64.*' -print -quit)"

      - name: Mount, architecture-check, install, and launch Intel DMG
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="$(find release -type f -name '*-x64.dmg' -print -quit)"
          test -n "$dmg_path" && test -f "$dmg_path"
          mount_dir="$RUNNER_TEMP/automnia-dmg-x64"
          installed_app="$RUNNER_TEMP/Automnia AI Nexus.app"
          mkdir -p "$mount_dir"
          hdiutil attach "$dmg_path" -mountpoint "$mount_dir" -nobrowse -readonly -quiet
          trap 'hdiutil detach "$mount_dir" -quiet >/dev/null 2>&1 || true' EXIT
          source_app="$mount_dir/Automnia AI Nexus.app"
          test -d "$source_app"
          archs="$(lipo -archs "$source_app/Contents/MacOS/Automnia AI Nexus")"
          test "$archs" = "x86_64"
          ditto "$source_app" "$installed_app"
          hdiutil detach "$mount_dir" -quiet
          AUTOMNIA_PACKAGED_MAC_APP_PATH="$installed_app" npm run smoke:packaged-electron-launch

      - name: Upload unsigned macOS release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: automnia-macos-public-release
          path: |
            release/**/*.dmg
            release/**/*.zip
            release/**/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 90

  macos-arm64:
    name: Unsigned Apple silicon macOS DMG and ZIP
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare vendored OpenClaw dependencies
        run: npm run prepare:openclaw-vendor

      - name: Prepare runtime bundles for readiness checks
        run: npm run prepare:runtime-bundles

      - name: Verify release candidate source
        run: npm run verify:release-candidate

      - name: Build unsigned Apple silicon Mac DMG and ZIP
        shell: bash
        env:
          AUTOMNIA_SKIP_PLATFORM_SIGNING: '1'
          AUTOMNIA_TARGET_ARCH: arm64
        run: bash scripts/build-macos-release.sh arm64

      - name: Validate Apple silicon package outputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find release -type f -name '*-arm64.dmg' -print -quit)"
          test -n "$(find release -type f -name '*-arm64.zip' -print -quit)"
          test -z "$(find release -type f -iname '*-x64.dmg' -print -quit)"

      - name: Mount, architecture-check, install, and launch Apple silicon DMG
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="$(find release -type f -name '*-arm64.dmg' -print -quit)"
          test -n "$dmg_path" && test -f "$dmg_path"
          mount_dir="$RUNNER_TEMP/automnia-dmg-arm64"
          installed_app="$RUNNER_TEMP/Automnia AI Nexus.app"
          mkdir -p "$mount_dir"
          hdiutil attach "$dmg_path" -mountpoint "$mount_dir" -nobrowse -readonly -quiet
          trap 'hdiutil detach "$mount_dir" -quiet >/dev/null 2>&1 || true' EXIT
          source_app="$mount_dir/Automnia AI Nexus.app"
          test -d "$source_app"
          archs="$(lipo -archs "$source_app/Contents/MacOS/Automnia AI Nexus")"
          test "$archs" = "arm64"
          ditto "$source_app" "$installed_app"
          hdiutil detach "$mount_dir" -quiet
          AUTOMNIA_PACKAGED_MAC_APP_PATH="$installed_app" npm run smoke:packaged-electron-launch

      - name: Upload unsigned Apple silicon release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: automnia-macos-arm64-public-release
          path: |
            release/**/*-arm64.dmg
            release/**/*-arm64.zip
            release/**/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 90

  linux:
    name: Linux AppImage and Debian package
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare vendored OpenClaw dependencies
        run: npm run prepare:openclaw-vendor

      - name: Prepare runtime bundles for readiness checks
        run: npm run prepare:runtime-bundles

      - name: Embed update verification configuration
        env:
          AUTOMNIA_UPDATE_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.AUTOMNIA_UPDATE_SIGNING_PRIVATE_KEY_PEM }}
          AUTOMNIA_UPDATE_SIGNING_KEY_ID: ${{ vars.AUTOMNIA_UPDATE_SIGNING_KEY_ID }}
          AUTOMNIA_UPDATE_BASE_URL: ${{ vars.AUTOMNIA_UPDATE_BASE_URL }}-x64
          AUTOMNIA_UPDATE_CHANNEL: stable-x64
        run: npm run release:update-build-config

      - name: Verify release candidate source under virtual display
        env:
          AUTOMNIA_ELECTRON_E2E_NO_SANDBOX: '1'
        run: xvfb-run -a npm run verify:release-candidate

      - name: Build Linux packages
        env:
          AUTOMNIA_UPDATE_REQUIRE_EMBEDDED_CONFIG: '1'
        run: npm run dist:linux

      - name: Install, launch, and remove x86_64 Debian package
        shell: bash
        run: |
          set -euo pipefail
          deb_path="$(find release -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb_path" && test -f "$deb_path"
          deb_path="$(realpath "$deb_path")"
          deb_arch="$(dpkg-deb -f "$deb_path" Architecture)"
          test "$deb_arch" = "amd64"
          package_name="$(dpkg-deb -f "$deb_path" Package)"
          linux_executable_name="$(node -p 'require("./package.json").build.linux.executableName')"
          sudo apt-get update
          sudo apt-get install -y "$deb_path"
          trap 'sudo apt-get remove -y "$package_name" >/dev/null 2>&1 || true' EXIT
          app_asar="$(dpkg-query --listfiles "$package_name" | grep -E '/resources/app\.asar$' | head -n 1)"
          test -n "$app_asar" && test -f "$app_asar"
          app_root="${app_asar%/resources/app.asar}"
          test -x "$app_root/$linux_executable_name"
          AUTOMNIA_PACKAGED_LINUX_ROOT="$app_root" AUTOMNIA_ELECTRON_E2E_NO_SANDBOX=1 xvfb-run -a npm run smoke:packaged-electron-launch
          sudo apt-get remove -y "$package_name"
          trap - EXIT

      - name: Verify and launch x86_64 AppImage under virtual display
        shell: bash
        run: |
          set -euo pipefail
          appimage_path="$(find release -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage_path" && test -f "$appimage_path"
          chmod +x "$appimage_path"
          machine="$(readelf -h "$appimage_path" | awk -F: '/Machine:/ { gsub(/^[[:space:]]+/, "", $2); print $2 }')"
          test "$machine" = "Advanced Micro Devices X86-64"
          APPIMAGE_EXTRACT_AND_RUN=1 \
            AUTOMNIA_PACKAGED_LINUX_APPIMAGE="$GITHUB_WORKSPACE/$appimage_path" \
            AUTOMNIA_ELECTRON_E2E_NO_SANDBOX=1 \
            timeout --signal=TERM --kill-after=10s 300s xvfb-run -a node --input-type=module <<'APPIMAGE_SMOKE'
          import assert from 'node:assert/strict'
          import { spawn } from 'node:child_process'
          import { existsSync, mkdtempSync, readFileSync, readdirSync, rmSync } from 'node:fs'
          import net from 'node:net'
          import os from 'node:os'
          import path from 'node:path'

          const appImagePath = path.resolve(process.env.AUTOMNIA_PACKAGED_LINUX_APPIMAGE || '')
          assert.ok(existsSync(appImagePath), `AppImage not found: ${appImagePath}`)
          const tempRoot = mkdtempSync(path.join(os.tmpdir(), 'automnia-appimage-smoke-'))
          const userDataDir = path.join(tempRoot, 'user-data')
          const openclawDir = path.join(tempRoot, 'openclaw')
          const workspaceRoot = path.join(tempRoot, 'workspace')
          const logPath = path.join(tempRoot, 'electron-e2e.log')
          const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms))

          async function freePort() {
            return await new Promise((resolve, reject) => {
              const server = net.createServer()
              server.once('error', reject)
              server.listen(0, '127.0.0.1', () => {
                const address = server.address()
                server.close((error) => {
                  if (error) reject(error)
                  else if (address && typeof address === 'object') resolve(address.port)
                  else reject(new Error('Could not allocate an AppImage smoke port'))
                })
              })
            })
          }

          function waitForExit(child, timeoutMs) {
            if (child.exitCode !== null || child.signalCode !== null) {
              return Promise.resolve({ code: child.exitCode, signal: child.signalCode })
            }
            return new Promise((resolve, reject) => {
              const timer = setTimeout(() => reject(new Error(`AppImage launcher did not exit within ${timeoutMs}ms`)), timeoutMs)
              child.once('exit', (code, signal) => {
                clearTimeout(timer)
                resolve({ code, signal })
              })
              child.once('error', (error) => {
                clearTimeout(timer)
                reject(error)
              })
            })
          }

          let child
          let launcherOutput = ''
          let spawnError
          let passed = false
          try {
            const [apiPort, frontendPort, gatewayPort, browserRelayPort] = await Promise.all([
              freePort(), freePort(), freePort(), freePort(),
            ])
            const env = {
              ...process.env,
              CONTROL_CENTER_PORT: String(apiPort),
              CONTROL_CENTER_FRONTEND_PORT: String(frontendPort),
              OPENCLAW_GATEWAY_PORT: String(gatewayPort),
              OPENCLAW_BROWSER_RELAY_PORT: String(browserRelayPort),
              CONTROL_CENTER_AUTOSTART_GATEWAY: '0',
              CONTROL_CENTER_GATEWAY_CHAT_CLIENT: '0',
              CONTROL_CENTER_TOKEN: 'appimage-release-e2e',
              AUTOMNIA_ELECTRON_E2E: '1',
              AUTOMNIA_ELECTRON_E2E_ALLOW_PARALLEL: '1',
              AUTOMNIA_ELECTRON_E2E_ASSERT_PTY: '1',
              AUTOMNIA_ELECTRON_E2E_KEEP_WINDOW_HIDDEN: '1',
              AUTOMNIA_ELECTRON_E2E_LOG_PATH: logPath,
              AUTOMNIA_ELECTRON_E2E_AUTO_QUIT_MS: '15000',
              AUTOMNIA_ELECTRON_E2E_ASSERT_NAVIGATION: '1',
              AUTOMNIA_ELECTRON_E2E_DISABLE_OPEN_EXTERNAL: '1',
              AUTOMNIA_ELECTRON_E2E_SKIP_PORT_CLEANUP: '1',
              AUTOMNIA_USER_DATA_DIR: userDataDir,
              OPENCLAW_STATE_DIR: openclawDir,
              OPENCLAW_HOME: openclawDir,
              CONTROL_CENTER_WORKSPACE_ROOT: workspaceRoot,
              APPIMAGE_EXTRACT_AND_RUN: '1',
            }
            child = spawn(appImagePath, ['--appimage-extract-and-run'], {
              cwd: path.dirname(appImagePath),
              env,
              detached: true,
              stdio: ['ignore', 'pipe', 'pipe'],
            })
            const appendOutput = (chunk) => {
              launcherOutput = (launcherOutput + chunk.toString('utf8')).slice(-20000)
            }
            child.stdout.on('data', appendOutput)
            child.stderr.on('data', appendOutput)
            child.once('error', (error) => { spawnError = error })

            const requiredMarkers = [
              '[automnia-e2e] port-cleanup-skipped',
              '[automnia-e2e] server-ready',
              '[automnia-e2e] navigation-policy-ok',
              '[automnia-e2e] pty-native-ok',
              '[automnia-e2e] auto-quit',
              '[automnia-e2e] quit-cleanup-complete',
            ]
            const deadline = Date.now() + 240000
            let content = ''
            let runtimeVerified = false
            while (Date.now() < deadline) {
              if (existsSync(logPath)) content = readFileSync(logPath, 'utf8')
              if (!runtimeVerified && content.includes('[automnia-e2e] server-ready')) {
                assert.ok(existsSync(userDataDir), 'AppImage startup must create the isolated Automnia user-data directory')
                assert.ok(existsSync(openclawDir), 'AppImage startup must create the isolated OpenClaw state directory')
                const runtimeParent = path.join(userDataDir, 'runtimes', 'openclaw')
                assert.ok(existsSync(runtimeParent), 'AppImage startup must stage OpenClaw under writable user data')
                const runtime = readdirSync(runtimeParent).find((entry) =>
                  existsSync(path.join(runtimeParent, entry, 'package.json')),
                )
                assert.ok(runtime, 'AppImage startup must stage a complete writable OpenClaw runtime')
                const runtimeRoot = path.join(runtimeParent, runtime)
                const runtimePackage = JSON.parse(readFileSync(path.join(runtimeRoot, 'package.json'), 'utf8'))
                const expectedRuntimeVersion = JSON.parse(readFileSync(path.join(process.cwd(), 'vendor', 'openclaw', 'package.json'), 'utf8')).version
                assert.equal(runtimePackage.version, expectedRuntimeVersion, 'AppImage must stage the OpenClaw version pinned by this release')
                assert.ok(existsSync(path.join(runtimeRoot, 'openclaw.mjs')), 'AppImage must stage the OpenClaw executable entry point')
                runtimeVerified = true
              }
              if (requiredMarkers.every((marker) => content.includes(marker))) break
              if (spawnError) throw spawnError
              if (child.exitCode !== null || child.signalCode !== null) {
                throw new Error(`AppImage exited before completing startup checks (code=${child.exitCode}, signal=${child.signalCode})`)
              }
              await wait(250)
            }
            if (!existsSync(logPath)) content = ''
            else content = readFileSync(logPath, 'utf8')
            const missing = requiredMarkers.filter((marker) => !content.includes(marker))
            assert.deepEqual(missing, [], `AppImage launch did not record required startup markers: ${missing.join(', ')}\n${content}\n${launcherOutput}`)
            assert.ok(runtimeVerified, 'AppImage writable runtime was not verified')
            const exit = await waitForExit(child, 60000)
            assert.equal(exit.code, 0, `AppImage launcher exited with code ${exit.code} and signal ${exit.signal}\n${content}\n${launcherOutput}`)
            passed = true
            console.log('AppImage no-FUSE launch smoke ok')
          } finally {
            if (child && !passed && child.exitCode === null && child.signalCode === null) {
              try { process.kill(-child.pid, 'SIGTERM') } catch { child.kill('SIGTERM') }
              await Promise.race([wait(5000), waitForExit(child, 5000).catch(() => {})])
              if (child.exitCode === null && child.signalCode === null) {
                try { process.kill(-child.pid, 'SIGKILL') } catch { child.kill('SIGKILL') }
              }
            }
            rmSync(tempRoot, { recursive: true, force: true })
          }
          APPIMAGE_SMOKE

      - name: Upload Linux release candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: automnia-linux-public-release
          path: |
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 90

  publish-updates:
    name: Publish verified desktop update channel to Google Cloud
    if: ${{ github.event_name == 'push' }}
    needs: [windows, macos, macos-arm64, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: desktop-update-stable-channel
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AUTOMNIA_UPDATE_REQUIRE_SIGNING: '1'
      AUTOMNIA_UPDATE_CHANNEL: stable-x64
      AUTOMNIA_UPDATE_BUCKET: ${{ vars.AUTOMNIA_UPDATE_BUCKET }}
      AUTOMNIA_LEGACY_UPDATE_BUCKET: ${{ vars.AUTOMNIA_LEGACY_UPDATE_BUCKET }}
      AUTOMNIA_UPDATE_TRUSTED_KEY_SHA256: ${{ vars.AUTOMNIA_UPDATE_TRUSTED_KEY_SHA256 }}
    steps:
      - name: Check out release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Install locked release tooling
        run: npm ci

      - name: Download Windows release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: automnia-windows-public-release
          path: release-downloads/windows

      - name: Download macOS release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: automnia-macos-public-release
          path: release-downloads/macos

      - name: Download Apple silicon macOS release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: automnia-macos-arm64-public-release
          path: release-downloads/macos-arm64

      - name: Download Linux release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: automnia-linux-public-release
          path: release-downloads/linux

      - name: Stage one coherent update channel
        env:
          AUTOMNIA_UPDATE_STAGE_INPUT: release-downloads
          AUTOMNIA_UPDATE_STAGE_OUTPUT: release/update-channel
          AUTOMNIA_RELEASE_VERSION: ${{ github.ref_name }}
          AUTOMNIA_UPDATE_ROLLOUT_PERCENTAGE: ${{ vars.AUTOMNIA_UPDATE_ROLLOUT_PERCENTAGE || '100' }}
        run: npm run release:update-stage

      - name: Sign combined cross-platform update manifest
        env:
          AUTOMNIA_RELEASE_ARTIFACT_ROOT: release/update-channel
          AUTOMNIA_UPDATE_OUTPUT_DIR: release/update-channel
          AUTOMNIA_UPDATE_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.AUTOMNIA_UPDATE_SIGNING_PRIVATE_KEY_PEM }}
          AUTOMNIA_UPDATE_SIGNING_KEY_ID: ${{ vars.AUTOMNIA_UPDATE_SIGNING_KEY_ID }}
          AUTOMNIA_UPDATE_ROLLOUT_PERCENTAGE: ${{ vars.AUTOMNIA_UPDATE_ROLLOUT_PERCENTAGE || '100' }}
          AUTOMNIA_UPDATE_MINIMUM_VERSION: ${{ vars.AUTOMNIA_UPDATE_MINIMUM_VERSION }}
          AUTOMNIA_UPDATE_MANDATORY_AFTER: ${{ vars.AUTOMNIA_UPDATE_MANDATORY_AFTER }}
          AUTOMNIA_UPDATE_RELEASE_NOTES_URL: https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md
        run: npm run release:update-manifest

      - name: Verify complete update channel before publication
        env:
          AUTOMNIA_RELEASE_ARTIFACT_ROOT: release/update-channel
          AUTOMNIA_UPDATE_OUTPUT_DIR: release/update-channel
        run: npm run release:update-verify

      - name: Verify installed-client trust and channel
        env:
          AUTOMNIA_RELEASE_VERSION: ${{ github.ref_name }}
        run: node scripts/publish-update-channel.cjs verify

      - name: Authenticate to Google Cloud without a service-account key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ secrets.GCP_UPDATE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_UPDATE_PUBLISHER_SERVICE_ACCOUNT }}

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Preflight both update buckets
        env:
          AUTOMNIA_RELEASE_VERSION: ${{ github.ref_name }}
        run: node scripts/publish-update-channel.cjs preflight

      - name: Publish x64 update channel to both buckets
        env:
          AUTOMNIA_RELEASE_VERSION: ${{ github.ref_name }}
        run: node scripts/publish-update-channel.cjs release

      - name: Publish customer installers to the private download bucket
        shell: bash
        env:
          INSTALLER_BUCKET: ${{ vars.AUTOMNIA_INSTALLER_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$INSTALLER_BUCKET" || { echo "AUTOMNIA_INSTALLER_BUCKET is required" >&2; exit 1; }
          find_one() {
            find release/update-channel -maxdepth 1 -type f -iname "$1" -print -quit
          }
          windows_installer="$(find_one '*Setup*.exe')"
          mac_x64="$(find_one '*-x64.dmg')"
          mac_arm64="$(find release-downloads/macos-arm64 -type f -iname '*-arm64.dmg' -print -quit)"
          linux_appimage="$(find_one '*.AppImage')"
          linux_deb="$(find_one '*.deb')"
          for required in "$windows_installer" "$mac_x64" "$mac_arm64" "$linux_appimage" "$linux_deb"; do
            test -n "$required" && test -f "$required" || { echo "Missing installer artifact: $required" >&2; exit 1; }
          done
          printf 'AUTOMNIA_WINDOWS_INSTALLER=%s\nAUTOMNIA_MAC_X64=%s\nAUTOMNIA_MAC_ARM64=%s\nAUTOMNIA_LINUX_APPIMAGE=%s\nAUTOMNIA_LINUX_DEB=%s\n' \
            "$windows_installer" "$mac_x64" "$mac_arm64" "$linux_appimage" "$linux_deb" >> "$GITHUB_ENV"
          gcloud storage buckets describe "gs://$INSTALLER_BUCKET" >/dev/null
          gcloud config set storage/parallel_composite_upload_enabled False >/dev/null
          gcloud storage cp --cache-control="no-store,max-age=0" "$windows_installer" "gs://$INSTALLER_BUCKET/releases/current/windows/Automnia-Setup-x64.exe"
          gcloud storage cp --cache-control="no-store,max-age=0" "$mac_x64" "gs://$INSTALLER_BUCKET/releases/current/macos/Automnia-AI-Nexus-x64.dmg"
          gcloud storage cp --cache-control="no-store,max-age=0" "$mac_arm64" "gs://$INSTALLER_BUCKET/releases/current/macos/Automnia-AI-Nexus-arm64.dmg"
          gcloud storage cp --cache-control="no-store,max-age=0" "$linux_appimage" "gs://$INSTALLER_BUCKET/releases/current/linux/Automnia-AI-Nexus-x86_64.AppImage"
          gcloud storage cp --cache-control="no-store,max-age=0" "$linux_deb" "gs://$INSTALLER_BUCKET/releases/current/linux/Automnia-AI-Nexus-x86_64.deb"

      - name: Publish public website download aliases
        shell: bash
        env:
          PUBLIC_DOWNLOAD_BUCKET: ${{ vars.AUTOMNIA_PUBLIC_DOWNLOAD_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$PUBLIC_DOWNLOAD_BUCKET" || { echo "AUTOMNIA_PUBLIC_DOWNLOAD_BUCKET is required" >&2; exit 1; }
          for required in "$AUTOMNIA_WINDOWS_INSTALLER" "$AUTOMNIA_MAC_X64" "$AUTOMNIA_MAC_ARM64" "$AUTOMNIA_LINUX_APPIMAGE" "$AUTOMNIA_LINUX_DEB"; do
            test -n "$required" && test -f "$required" || { echo "Missing installer artifact: $required" >&2; exit 1; }
          done
          gcloud storage buckets describe "gs://$PUBLIC_DOWNLOAD_BUCKET" >/dev/null
          # These stable aliases are the URLs rendered by the Shopify download
          # page. Keep them non-cacheable so a browser never retains a prior
          # release after the next tagged publish.
          gcloud storage cp --cache-control="no-store,max-age=0" "$AUTOMNIA_WINDOWS_INSTALLER" "gs://$PUBLIC_DOWNLOAD_BUCKET/releases/current/Automnia-Setup-x64.exe"
          gcloud storage cp --cache-control="no-store,max-age=0" "$AUTOMNIA_MAC_X64" "gs://$PUBLIC_DOWNLOAD_BUCKET/releases/current/Automnia-AI-Nexus-x64.dmg"
          gcloud storage cp --cache-control="no-store,max-age=0" "$AUTOMNIA_MAC_ARM64" "gs://$PUBLIC_DOWNLOAD_BUCKET/releases/current/Automnia-AI-Nexus-arm64.dmg"
          gcloud storage cp --cache-control="no-store,max-age=0" "$AUTOMNIA_LINUX_APPIMAGE" "gs://$PUBLIC_DOWNLOAD_BUCKET/releases/current/Automnia-AI-Nexus-x86_64.AppImage"
          gcloud storage cp --cache-control="no-store,max-age=0" "$AUTOMNIA_LINUX_DEB" "gs://$PUBLIC_DOWNLOAD_BUCKET/releases/current/Automnia-AI-Nexus-x86_64.deb"

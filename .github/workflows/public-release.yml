name: Public Release Candidate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: public-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    name: Signed Windows installer and lifecycle evidence
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      AUTOMNIA_RELEASE_REQUIRE_SIGNING: '1'
      AUTOMNIA_UPDATE_REQUIRE_SIGNING: '1'
    steps:
      - name: Check out release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Require signing secrets
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          RELEASE_KEY: ${{ secrets.AUTOMNIA_RELEASE_SIGNING_PRIVATE_KEY_PEM }}
          UPDATE_KEY: ${{ secrets.AUTOMNIA_UPDATE_SIGNING_PRIVATE_KEY_PEM }}
        run: |
          foreach ($name in @('WIN_CSC_LINK', 'WIN_CSC_KEY_PASSWORD', 'RELEASE_KEY', 'UPDATE_KEY')) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) { throw "Missing required release secret: $name" }
          }

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare vendored OpenClaw dependencies
        run: npm run prepare:openclaw-vendor

      - name: Verify release candidate source
        run: npm run verify:release-candidate

      - name: Build and Authenticode-sign NSIS installer
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run dist:win

      - name: Generate signed update manifest
        env:
          AUTOMNIA_UPDATE_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.AUTOMNIA_UPDATE_SIGNING_PRIVATE_KEY_PEM }}
          AUTOMNIA_UPDATE_SIGNING_KEY_ID: ${{ vars.AUTOMNIA_UPDATE_SIGNING_KEY_ID }}
        run: npm run release:update-manifest

      - name: Verify update manifest
        run: npm run release:update-verify

      - name: Run install, upgrade, rollback, and uninstall lifecycle
        env:
          AUTOMNIA_PREVIOUS_WINDOWS_INSTALLER_PATH: ${{ vars.AUTOMNIA_PREVIOUS_WINDOWS_INSTALLER_PATH }}
        run: npm run release:lifecycle:windows

      - name: Generate release SBOM and checksums
        run: npm run release:evidence

      - name: Sign checksum manifest
        env:
          AUTOMNIA_RELEASE_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.AUTOMNIA_RELEASE_SIGNING_PRIVATE_KEY_PEM }}
          AUTOMNIA_RELEASE_SIGNING_KEY_ID: ${{ vars.AUTOMNIA_RELEASE_SIGNING_KEY_ID }}
        run: npm run release:sign

      - name: Validate complete public release chain
        run: npm run release:validate

      - name: Upload signed Windows release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: automnia-windows-public-release
          path: |
            release/*Setup*.exe
            release/updates/**
            release/evidence/**
          if-no-files-found: error
          retention-days: 90

  macos:
    name: Signed and notarized macOS DMG
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check out release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Require Apple signing secrets
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name:-}" || { echo "Missing required release secret: $name" >&2; exit 1; }
          done

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare vendored OpenClaw dependencies
        run: npm run prepare:openclaw-vendor

      - name: Verify release candidate source
        run: npm run verify:release-candidate

      - name: Build, sign, and notarize DMG
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac

      - name: Validate notarization ticket
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find release -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"

      - name: Upload notarized macOS release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: automnia-macos-public-release
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 90

  linux:
    name: Linux AppImage and Debian package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare vendored OpenClaw dependencies
        run: npm run prepare:openclaw-vendor

      - name: Verify release candidate source under virtual display
        run: xvfb-run -a npm run verify:release-candidate

      - name: Build Linux packages
        run: npm run dist:linux

      - name: Upload Linux release candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: automnia-linux-public-release
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 90

name: Cross-Platform Quality

on:
  push:
    branches:
      - main
      - 'codex/**'
      - 'production/**'
  pull_request:
    branches:
      - main

concurrency:
  group: cross-platform-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-and-build:
    name: ${{ matrix.os }} source and build validation
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:dependencies

      - name: Scan for checked-in secrets
        run: npm run secret:scan

      - name: Lint and type-check
        run: |
          npm run lint
          npm run typecheck

      - name: Run behavioral unit tests with coverage
        run: npm run test:unit:coverage

      - name: Verify architecture and security contracts
        run: |
          npm run smoke:server-architecture
          npm run smoke:route-inventory
          npm run smoke:shell-production-ui
          npm run smoke:interactive-controls
          npm run smoke:security
          npm run smoke:session-tokens
          npm run smoke:gateway-auth-hardening
          npm run smoke:release-lifecycle

      - name: Build standalone application
        run: npm run build:standalone

      - name: Enforce renderer bundle budgets
        run: npm run check:bundle-budgets

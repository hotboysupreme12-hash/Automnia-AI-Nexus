name: Production Audit Snapshot

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    name: Export authored source for production audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Stage authored source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-snapshot
          cp -R .github audit-snapshot/.github
          cp -R electron audit-snapshot/electron
          cp -R server audit-snapshot/server
          cp -R src audit-snapshot/src
          cp -R scripts audit-snapshot/scripts
          cp -R docs audit-snapshot/docs
          cp package.json package-lock.json audit-snapshot/
          cp tsconfig*.json audit-snapshot/
          cp eslint.config.* audit-snapshot/ 2>/dev/null || true
          cp vite.config.* audit-snapshot/ 2>/dev/null || true
          cp tailwind.config.* audit-snapshot/ 2>/dev/null || true
          cp postcss.config.* audit-snapshot/ 2>/dev/null || true
          cp AGENTS.md README.md audit-snapshot/ 2>/dev/null || true

      - name: Upload production audit snapshot
        uses: actions/upload-artifact@v4
        with:
          name: dystopai-production-audit-source
          path: audit-snapshot/**
          if-no-files-found: error
          retention-days: 1

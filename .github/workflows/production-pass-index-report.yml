name: Production Pass Index Report

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  index-report:
    name: Report server/index.ts architecture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report server entrypoint architecture
        run: node scripts/production-pass/report-index-architecture.mjs server/index.ts

name: Server Composition Architecture Report

on:
  push:
    branches:
      - main
      - 'codex/**'
      - 'production/**'
    paths:
      - server/**
      - scripts/report-server-index-architecture.mjs
      - scripts/smoke-server-entrypoint-boundary.ts
      - scripts/smoke-route-inventory.ts
      - server/routes/controlPlaneRouteInventory.json
      - package.json
      - .github/workflows/server-index-architecture.yml
  pull_request:
    branches:
      - main
    paths:
      - server/**
      - scripts/report-server-index-architecture.mjs
      - scripts/smoke-server-entrypoint-boundary.ts
      - scripts/smoke-route-inventory.ts
      - server/routes/controlPlaneRouteInventory.json
      - package.json
      - .github/workflows/server-index-architecture.yml

concurrency:
  group: server-architecture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out proposed revision
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify composition boundary
        run: npm run smoke:server-architecture

      - name: Verify route inventory
        run: npm run smoke:route-inventory

      - name: Generate architecture report
        run: node scripts/report-server-index-architecture.mjs

      - name: Upload architecture evidence
        uses: actions/upload-artifact@v4
        with:
          name: server-composition-architecture
          if-no-files-found: error
          retention-days: 7
          path: docs/generated/server-index-architecture.md

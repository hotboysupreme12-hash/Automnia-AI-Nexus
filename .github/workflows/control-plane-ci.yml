name: Control Plane CI

on:
  push:
    branches:
      - main
      - 'codex/**'
      - 'production/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:


concurrency:
  group: control-plane-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Hardened control plane
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      DYSTOPAI_RELEASE_REQUIRE_SIGNING: 'false'

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare vendored OpenClaw dependencies
        run: npm run prepare:openclaw-vendor

      - name: Audit production dependencies
        run: npm run audit:dependencies

      - name: Scan for checked-in secrets
        run: npm run secret:scan

      - name: Lint source
        run: npm run lint

      - name: Type-check app, server, and Electron
        run: npm run typecheck

      - name: Run production hardening suite
        run: npm test

      - name: Enforce unit coverage thresholds
        run: npm run test:unit:coverage

      - name: Build server bundle
        run: npm run build:server

      - name: Build client bundle
        run: npm run build:client

      - name: Enforce renderer bundle budgets
        run: npm run check:bundle-budgets

      - name: Run Electron end-to-end smoke
        run: npm run smoke:electron-e2e

      - name: Prepare reproducible runtime bundles
        run: npm run prepare:runtime-bundles

      - name: Package desktop directory
        run: node scripts/package-desktop.cjs --dir

      - name: Run packaged desktop launch smoke
        run: npm run smoke:packaged-electron-launch

      - name: Build unsigned Windows installer candidate
        if: ${{ github.event_name != 'pull_request' && env.DYSTOPAI_RELEASE_REQUIRE_SIGNING != 'true' }}
        run: node scripts/package-desktop.cjs --win --x64

      - name: Generate release SBOM and checksums
        run: npm run release:evidence

      - name: Sign release evidence
        if: ${{ vars.DYSTOPAI_RELEASE_SIGNING_ENABLED == 'true' && env.DYSTOPAI_RELEASE_REQUIRE_SIGNING != 'true' }}
        env:
          DYSTOPAI_RELEASE_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.DYSTOPAI_RELEASE_SIGNING_PRIVATE_KEY_PEM }}
          DYSTOPAI_RELEASE_SIGNING_KEY_ID: ${{ vars.DYSTOPAI_RELEASE_SIGNING_KEY_ID }}
        run: npm run release:sign

      - name: Validate packaged release artifacts
        run: npm run release:validate

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dystopai-release-evidence
          path: release/evidence/**
          if-no-files-found: error

      - name: Upload Windows installer candidate
        if: ${{ github.event_name != 'pull_request' && env.DYSTOPAI_RELEASE_REQUIRE_SIGNING != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dystopai-windows-installer-candidate
          path: release/*Setup*.exe
          if-no-files-found: error

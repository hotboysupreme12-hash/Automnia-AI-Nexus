name: Control Plane CI

on:
  push:
    branches:
      - main
      - 'codex/**'
      - 'production/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:


concurrency:
  group: control-plane-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Hardened control plane
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      AUTOMNIA_RELEASE_REQUIRE_SIGNING: 'false'

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare vendored OpenClaw dependencies
        run: npm run prepare:openclaw-vendor

      - name: Initialize CI evidence folders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/evidence/ci-logs | Out-Null
          New-Item -ItemType Directory -Force -Path release/evidence/bundle-budgets | Out-Null

      - name: Audit production dependencies
        run: npm run audit:dependencies

      - name: Scan for checked-in secrets
        run: npm run secret:scan

      - name: Lint source
        run: npm run lint

      - name: Type-check app, server, and Electron
        run: npm run typecheck

      - name: Run production hardening suite
        shell: pwsh
        run: |
          npm test 2>&1 | Tee-Object -FilePath release/evidence/ci-logs/npm-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Enforce unit coverage thresholds
        shell: pwsh
        run: |
          npm run test:unit:coverage 2>&1 | Tee-Object -FilePath release/evidence/ci-logs/unit-coverage.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build server bundle
        run: npm run build:server

      - name: Build client bundle
        run: npm run build:client

      - name: Enforce renderer bundle budgets
        shell: pwsh
        run: |
          npm run check:bundle-budgets 2>&1 | Tee-Object -FilePath release/evidence/bundle-budgets/renderer-bundle-budgets.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Electron end-to-end smoke
        shell: pwsh
        run: |
          npm run smoke:electron-e2e 2>&1 | Tee-Object -FilePath release/evidence/ci-logs/electron-e2e-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare reproducible runtime bundles
        run: npm run prepare:runtime-bundles

      - name: Package desktop directory
        shell: pwsh
        run: |
          node scripts/package-desktop.cjs --dir 2>&1 | Tee-Object -FilePath release/evidence/ci-logs/package-desktop-dir.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run packaged desktop launch smoke
        shell: pwsh
        run: |
          npm run smoke:packaged-electron-launch 2>&1 | Tee-Object -FilePath release/evidence/ci-logs/packaged-electron-launch.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Capture packaged beta screenshots
        shell: pwsh
        run: |
          npm run capture:packaged-beta-screenshots 2>&1 | Tee-Object -FilePath release/evidence/ci-logs/packaged-beta-screenshots.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build unsigned Windows installer candidate
        if: ${{ github.event_name != 'pull_request' && env.AUTOMNIA_RELEASE_REQUIRE_SIGNING != 'true' }}
        run: node scripts/package-desktop.cjs --win --x64

      - name: Generate release SBOM and checksums
        run: npm run release:evidence

      - name: Sign release evidence
        if: ${{ vars.AUTOMNIA_RELEASE_SIGNING_ENABLED == 'true' && env.AUTOMNIA_RELEASE_REQUIRE_SIGNING != 'true' }}
        env:
          AUTOMNIA_RELEASE_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.AUTOMNIA_RELEASE_SIGNING_PRIVATE_KEY_PEM }}
          AUTOMNIA_RELEASE_SIGNING_KEY_ID: ${{ vars.AUTOMNIA_RELEASE_SIGNING_KEY_ID }}
        run: npm run release:sign

      - name: Validate packaged release artifacts
        shell: pwsh
        run: |
          npm run release:validate 2>&1 | Tee-Object -FilePath release/evidence/ci-logs/release-validate.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: automnia-release-evidence
          path: release/evidence/**
          if-no-files-found: error

      - name: Upload packaged screenshot evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: automnia-packaged-beta-screenshots
          path: output/packaged-beta-screenshots/**
          if-no-files-found: error

      - name: Upload Windows installer candidate
        if: ${{ github.event_name != 'pull_request' && env.AUTOMNIA_RELEASE_REQUIRE_SIGNING != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: automnia-windows-installer-candidate
          path: release/*Setup*.exe
          if-no-files-found: error
